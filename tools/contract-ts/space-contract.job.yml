run: //tools:deno
args:
  - run
  - --cached-only
  - --allow-read
  - --allow-write=contract.gen.ts
  - emit.ts
  - ../../packages/wuhu-core/Targets/SpaceContract/Tests/contract
  - --out
  - contract.gen.ts
inputs:
  - emit.ts
  - //packages/wuhu-core/Targets/SpaceContract/Tests/contract/*.schema.json
  - //deno.json
  - //deno.lock
  - job: //:dependencies
    output: dependencies
    at: dependencies
environment:
  DENO_DIR: dependencies
outputs:
  - contract.gen.ts
