name: wuhu-serve
owner: shared
swiftToolsVersion: "6.2"
packageName: WuhuServe
products:
  - Serve
  - ServeSSE
  - ServeRouting
  - ServeNIO
  - ServeTLS
  - ServeTesting
platforms:
  iOS: "26.0"
  macOS: "26.0"
  visionOS: "26.0"
checks:
  build: [linux, mac, ios, visionos]
  test: [linux, mac]
externalPackages:
  wuhu-fetch:
    path: ../wuhu-fetch
    products: [Fetch, FetchAsyncHTTPClient, FetchWebSocket, PinnedTLS]
  swift-http-types:
    url: https://github.com/apple/swift-http-types.git
    from: "1.5.1"
    products: [HTTPTypes]
  async-http-client:
    url: https://github.com/swift-server/async-http-client.git
    from: "1.35.0"
    products: [AsyncHTTPClient]
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    exact: "2.101.3"
    products: [NIOCore, NIOHTTP1, NIOPosix, NIOWebSocket]
  swift-nio-ssl:
    url: https://github.com/apple/swift-nio-ssl.git
    from: "2.29.0"
    products: [NIOSSL]
  swift-nio-http2:
    url: https://github.com/apple/swift-nio-http2.git
    from: "1.36.0"
    products: [NIOHTTP2]
  swift-certificates:
    url: https://github.com/apple/swift-certificates.git
    from: "1.10.0"
    products: [X509]
  swift-asn1:
    url: https://github.com/apple/swift-asn1.git
    from: "1.3.0"
    products: [SwiftASN1]
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    exact: "4.3.1"
    products: [Crypto]
