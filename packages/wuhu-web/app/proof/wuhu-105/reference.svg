<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760"
  viewBox="0 0 1120 760">
  <rect width="1120" height="760" fill="#f4f6f2" />
  <style>
  text {
    font-family: system-ui,sans-serif;
    fill: #293932;
  }
  .title {
    font-size: 24px;
    font-weight: 650;
  }
  .label {
    font-size: 17px;
    font-weight: 600;
  }
  .body {
    font-size: 15px;
  }
  .small {
    font-size: 13px;
    fill: #617367;
  }
  .panel {
    fill: white;
    stroke: #d7dfd4;
  }
  .line {
    stroke: #d7dfd4;
    stroke-width: 1;
  }
  .green {
    fill: #187454;
  }
  </style>
  <text x="36" y="43"
    class="title">Partial history · newest content first, older history on demand</text>
  <text x="36" y="72"
    class="body">Placement mockup — native macOS / iOS and responsive web share the same loading behavior.</text>
  <rect x="36" y="104" width="630" height="422" rx="14" class="panel" />
  <text x="58" y="138"
    class="label">Desktop · message box or session transcript</text>
  <line x1="36" x2="666" y1="158" y2="158" class="line" />
  <rect x="220" y="176" width="260" height="34" rx="8" fill="#eef3ed" />
  <text x="247" y="198" class="body">↑ Load older / Loading… / Retry</text>
  <text x="58" y="243"
    class="small">History edge is inside the scrolling content, not the navigation sidebar.</text>
  <rect x="58" y="270" width="584" height="68" rx="8" fill="#f5f7f3" />
  <text x="76" y="298" class="label">Visible row A</text>
  <text x="76" y="321"
    class="small">Keep this row + viewport offset when older rows are prepended.</text>
  <text x="76" y="372" class="body">Message B / older work summary</text>
  <text x="76" y="416" class="body">Latest message / latest inference</text>
  <rect x="267" y="456" width="170" height="35" rx="18" fill="#e4eee6" />
  <text x="288" y="479" class="body">↓ Jump to latest</text>
  <rect x="708" y="104" width="376" height="422" rx="24" class="panel" />
  <text x="731" y="140" class="label">Compact · iOS / narrow web</text>
  <line x1="708" x2="1084" y1="158" y2="158" class="line" />
  <text x="777" y="198" class="body">↑ Load older / Retry</text>
  <rect x="730" y="270" width="332" height="68" rx="8" fill="#f5f7f3" />
  <text x="747" y="298" class="label">Visible row A</text>
  <text x="747" y="321" class="small">Same stable anchor.</text>
  <text x="747" y="372" class="body">Message B / older work summary</text>
  <text x="747" y="416" class="body">Latest message / latest inference</text>
  <rect x="810" y="456" width="170" height="35" rx="18" fill="#e4eee6" />
  <text x="831" y="479" class="body">↓ Jump to latest</text>
  <text x="36" y="568" class="label">Open or reconnect</text>
  <text x="36" y="597"
    class="body">Optional cached paint → bounded tail snapshot → live stream after snapshot head</text>
  <text x="36" y="632" class="label">Read upward</text>
  <text x="36" y="660"
    class="body">User approaches older edge → one bounded page → prepend without moving row A</text>
  <text x="36" y="701"
    class="small">Exhausted: quiet “Beginning of history”. Failure: retry at the edge; loaded content and live stream stay usable.</text>
  <text x="36" y="724"
    class="small">No eager walk to the beginning, no sidebar badges, no change to the composer. Jump pill appears only away from latest.</text>
</svg>
