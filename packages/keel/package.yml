name: keel
owner: shared
swiftToolsVersion: "6.3"
packageName: Keel
products:
  - KeelObjectStore
platforms:
  iOS: "26.0"
  macOS: "26.0"
  visionOS: "26.0"
checks:
  build: [linux, mac]
  test: [linux, mac]
externalPackages:
  swift-http-types:
    url: https://github.com/apple/swift-http-types.git
    from: "1.5.1"
    products: [HTTPTypes]
  wuhu-fetch:
    path: ../wuhu-fetch
    products: [Fetch, FetchAsyncHTTPClient]
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    exact: "4.3.1"
    products: [Crypto]
  async-http-client:
    url: https://github.com/swift-server/async-http-client.git
    from: "1.35.0"
    products: [AsyncHTTPClient]
