name: wuhu-fetch
owner: shared
swiftToolsVersion: "6.2"
packageName: WuhuFetch
products:
  - Fetch
  - FetchURLSession
  - FetchAsyncHTTPClient
  - FetchSSE
  - FetchOpenAPI
  - FetchTesting
  - FetchWebSocket
  - PinnedTLS
platforms:
  iOS: "26.0"
  macOS: "26.0"
  visionOS: "26.0"
checks:
  build: [linux, mac, ios, visionos]
  test: [linux, mac]
externalPackages:
  swift-dependencies:
    url: https://github.com/pointfreeco/swift-dependencies.git
    from: "1.14.1"
    products: [Dependencies, DependenciesTestSupport]
  swift-log:
    url: https://github.com/apple/swift-log.git
    from: "1.10.0"
    products: [Logging]
  swift-http-types:
    url: https://github.com/apple/swift-http-types.git
    from: "1.5.1"
    products: [HTTPTypes]
  async-http-client:
    url: https://github.com/swift-server/async-http-client.git
    from: "1.35.0"
    products: [AsyncHTTPClient]
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    exact: "2.101.3"
    products: [NIOCore, NIOEmbedded, NIOHTTP1, NIOPosix, NIOTLS, NIOWebSocket]
  swift-nio-ssl:
    url: https://github.com/apple/swift-nio-ssl.git
    from: "2.29.0"
    products: [NIOSSL]
  swift-nio-http2:
    url: https://github.com/apple/swift-nio-http2.git
    from: "1.36.0"
    products: [NIOHTTP2]
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    exact: "4.3.1"
    products: [Crypto]
  swift-openapi-runtime:
    url: https://github.com/apple/swift-openapi-runtime.git
    from: "1.8.0"
    products: [OpenAPIRuntime]
