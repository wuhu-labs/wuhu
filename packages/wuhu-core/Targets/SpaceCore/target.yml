name: SpaceCore
kind: library
sources: Sources
checks:
  build: [linux, mac]
  test: [linux, mac]
dependencies:
  - TaskLifetime
  - name: CImageCodec
    platforms: [linux]
  - Assertion
  - SpaceFS
  - DocIndex
  - Instructions
  - MachineContract
  - OperationProtocol
  - SessionDomain
  - SpaceContract
  - SpaceSQL
  - WmdDocument
  - CanvasDocument
  - LiveDocument

  - WuhuAI
  - JSONValue
  - JSONSchema
  - OrderedCollections
  - Crypto
  - GRDB
  - GRDBSQLite
  - KeelObjectStore
  - StructuredQueries
  - StructuredQueriesCore
  - StructuredQueriesSQLite
  - Dependencies
  - Clocks
  - Logging
  - Wuwei
  - WuweiQueries
tests:
  exclude:
    - Fixtures/**
  # The storage lint reads the sources back by path; the viewing vector test
  # reads the clients' contract fixture.
  data:
    - Targets/SpaceCore/Sources
    - Targets/SpaceContract/Tests/contract
  resources:
    - path: Fixtures
      mode: copy
  dependencies:
    - Wuwei
    - Fetch
    - OperationRuntime
    - DeterministicDependencies
    - name: CImageCodec
      platforms: [linux]

    - OrderedCollections
    - SpaceFS
    - KeelObjectStore
    - DocIndex
    - MachineContract
    - OperationProtocol
    - Crypto
    - SessionDomain
    - ModelProviders
    - SpaceContract
    - SpaceSQL
    - WmdDocument
    - CanvasDocument
    - LiveDocument
    - Loro
    - WuhuAI
    - JSONValue
    - GRDB
    - StructuredQueries
    - Dependencies
    - DependenciesTestSupport
    - Clocks
    - ControlledTime
    - Logging
    - Scratch
