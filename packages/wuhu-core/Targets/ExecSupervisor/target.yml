name: ExecSupervisor
kind: library
sources: Sources
checks:
  build: [linux, mac]
  test: [linux, mac]
dependencies:
  - TaskLifetime
  - DeploymentAdmin
  - Logging
  - ComputerFiles
  - CExecSupervisor
  - MachineContract
  - OperationProtocol
  - OperationRuntime
  - JSONValue
  - Fetch
  - FetchTunnel
  - Serve
  - ServeNIO
  - FetchAsyncHTTPClient
  - AsyncHTTPClient
  - NIOCore
  - NIOPosix
tests:
  size: large
  # Retirement tests run real supervisor processes: `wuhu machine-v2 supervise`.
  externalData:
    - //packages/wuhu-core:wuhu_unstamped
  env:
    WUHU_CLI: "$(rootpath //packages/wuhu-core:wuhu_unstamped)"
  resources:
    - path: Recordings
      mode: copy
  exclude:
    - Recordings/**
  dependencies:
    - TaskLifetime
    - ComputerFiles
    - NIOPosix
    - AsyncHTTPClient
    - CExecSupervisor
    - FetchExchangeRecording
    - OperationProtocol
    - OperationRuntime
    - JSONValue
    - Fetch
    - Serve
    - ServeNIO
    - FetchAsyncHTTPClient
    - Clocks
    - Scratch
