name: SpaceServer
kind: library
sources: Sources
embeddedResources:
  - name: WebApp
    target: //packages/wuhu-web/app:bundle
    typeName: EmbeddedWebApp
    symbolName: webapp
  - name: ViewProviders
    path: ViewProviders
    typeName: EmbeddedViewProviders
    symbolName: viewproviders
  - name: ShellSDK
    target: //packages/wuhu-web/app:shell-sdk
    typeName: EmbeddedShellSDK
    symbolName: shellsdk
checks:
  build: [linux, mac]
  test: [linux, mac]
dependencies:
  - Assertion


  - Credentials
  - MachineContract
  - MachineChannel
  - SessionDomain
  - SessionTools
  - LoopCore
  - InferenceKit
  - SpaceContract
  - SpaceTools
  - SpaceCore
  - SpaceFS
  - SystemFiles
  - WuhuAI
  - Crypto
  - JSONValue
  - OrderedCollections
  - Fetch
  - Serve
  - ServeRouting
  - ServeSSE
  - ServeNIO
  - ServeTLS
  - HTTPTypes
  - Logging
  - Dependencies
  - AsyncHTTPClient
  - NIOCore
  - NIOHTTP1
  - Subprocess
  - WebPush
  - WuhuVFS
tests:
  size: large
  dependencies:
    - Assertion


    - Credentials
    - Crypto
    - MachineContract
    - MachineChannel
    - MachineAgent
    - SessionDomain
    - SessionTools
    - LoopCore
    - InferenceKit
    - WuhuAI
    - SpaceContract
    - SpaceTools
    - SpaceCore
    - SpaceFS
    - SystemFiles
    - JSONValue
    - OrderedCollections
    - Fetch
    - FetchSSE
    - FetchWebSocket
    - FetchAsyncHTTPClient
    - AsyncHTTPClient
    - NIOCore
    - NIOPosix
    - Serve
    - ServeNIO
    - ServeTesting
    - HTTPTypes
    - Dependencies
    - DependenciesTestSupport
    - Clocks
    - ControlledTime
    - WuhuRecordReplay
    - Logging
    - WebPush
    - GRDB
    - Scratch
    - ScratchTesting
    - WuhuVFS
  resources:
    - path: Recordings
      mode: copy
    - path: Backcompat
      mode: copy
