name: wuwei
owner: shared
swiftToolsVersion: "6.2"
packageName: Wuwei
products:
  - Wuwei
  - WuweiQueries
  - SSHMachine
platforms:
  macOS: "26.0"
swiftSettings:
  - enableUpcomingFeature: NonisolatedNonsendingByDefault
checks:
  build: [linux, mac]
  test: [linux, mac]
externalPackages:
  grdb.swift:
    url: https://github.com/groue/GRDB.swift.git
    exact: "7.10.0"
    products: [GRDBSQLite]
  swift-collections:
    url: https://github.com/apple/swift-collections
    from: "1.1.0"
    products: [DequeModule]
  swift-log:
    url: https://github.com/apple/swift-log.git
    from: "1.10.0"
    products: [Logging]
  swift-syntax:
    url: https://github.com/swiftlang/swift-syntax
    exact: "604.0.0"
    products: [SwiftSyntax, SwiftSyntaxMacros, SwiftSyntaxBuilder, SwiftCompilerPlugin, SwiftSyntaxMacrosTestSupport]
  swift-structured-queries:
    url: https://github.com/wuhu-labs/swift-structured-queries
    revision: 4f6be045f379601ef88924a3fa934555eca58327
    products: [StructuredQueries, StructuredQueriesCore]
  swift-subprocess:
    url: https://github.com/swiftlang/swift-subprocess.git
    exact: "1.0.0-beta.1"
    products: [Subprocess]
