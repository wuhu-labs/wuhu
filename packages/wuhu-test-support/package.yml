name: wuhu-test-support
owner: shared
swiftToolsVersion: "6.2"
packageName: WuhuTestSupport
products:
  - ControlledTime
  - WuhuRecordReplay
platforms:
  iOS: "26.0"
  macOS: "26.0"
  visionOS: "26.0"
checks:
  build: [linux, mac, ios, visionos]
  test: [linux, mac]
externalPackages:
  swift-dependencies:
    url: https://github.com/pointfreeco/swift-dependencies.git
    from: "1.14.1"
    products: [Dependencies]
  swift-clocks:
    url: https://github.com/pointfreeco/swift-clocks
    branch: clocks-2
    products: [Clocks]
  swift-http-types:
    url: https://github.com/apple/swift-http-types.git
    from: "1.5.1"
    products: [HTTPTypes]
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    exact: "4.3.1"
    products: [Crypto]
  wuhu-json:
    path: ../wuhu-json
    products: [JSONValue]
  wuhu-fetch:
    path: ../wuhu-fetch
    products: [Fetch, FetchURLSession, FetchWebSocket]
