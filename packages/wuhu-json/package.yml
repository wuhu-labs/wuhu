  macOS: "15.4"
  tvOS: "26.0"
  visionOS: "26.0"
checks:
  build: [linux, mac, ios, tvos, visionos]
  test: [linux, mac]
externalPackages:
  swift-collections:
    url: https://github.com/apple/swift-collections
    from: "1.1.0"
    products: [OrderedCollections]
